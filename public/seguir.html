<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alta Vibra — En vivo</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #08090F;
  --panel:  #0D1018;
  --glass:  rgba(255,255,255,.04);
  --border: rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.16);
  --text:   #E6EEFF;
  --muted:  #4E6080;
  --cyan:   #00C8FF;
  --gold:   #F5A623;
  --green:  #00E598;
  --red:    #FF5050;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  padding-bottom: 40px;
}

.sg-header {
  display:flex; align-items:center; gap:12px;
  padding: calc(env(safe-area-inset-top,0px) + 20px) 18px 16px;
}
.sg-header img { width:44px; height:44px; border-radius:12px; object-fit:cover; flex-shrink:0; }
.sg-header-title { font-size:18px; font-weight:700; line-height:1.2; }
.sg-header-sub { font-size:12px; color:var(--muted); margin-top:2px; display:flex; align-items:center; gap:6px; }
.sg-live-dot {
  width:7px; height:7px; border-radius:50%; background:var(--red);
  box-shadow:0 0 0 0 rgba(255,80,80,.6);
  animation: sg-pulse 1.6s infinite;
}
@keyframes sg-pulse {
  0% { box-shadow:0 0 0 0 rgba(255,80,80,.55); }
  70% { box-shadow:0 0 0 7px rgba(255,80,80,0); }
  100% { box-shadow:0 0 0 0 rgba(255,80,80,0); }
}

.sg-wrap { padding: 0 14px; max-width:560px; margin:0 auto; }

.sg-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 14px;
}
.sg-day { font-size:22px; font-weight:700; }
.sg-city { font-size:15px; color:var(--cyan); margin-top:4px; font-weight:600; }
.sg-date { font-size:12px; color:var(--muted); margin-top:2px; }

.sg-km-txt { font-size:13.5px; font-weight:600; margin-bottom:8px; }
.sg-km-track { height:8px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
.sg-km-bar { height:100%; width:0%; background:linear-gradient(90deg,var(--cyan),var(--green)); border-radius:5px; transition:width .6s ease; }

.sg-section-title { font-size:13px; font-weight:700; letter-spacing:.3px; color:var(--text); margin: 22px 0 10px; padding:0 4px; }

#sg-map { height: 260px; border-radius: 16px; overflow:hidden; border:1px solid var(--border); }
.sg-legend { margin-top: 10px; display:flex; flex-direction:column; gap:6px; }
.sg-legend-item { font-size:12.5px; display:flex; align-items:center; gap:8px; color:var(--text); }
.sg-legend-when { color:var(--muted); }
.sg-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

.sg-empty-mini { font-size:12.5px; color:var(--muted); padding:10px 4px; text-align:center; }

.ap-grid {
  display:grid; grid-template-columns:repeat(3, 1fr);
  grid-auto-rows:31vw; grid-auto-flow:dense; gap:2px;
  border-radius:14px; overflow:hidden;
}
.ap-tile { position:relative; overflow:hidden; cursor:pointer; background:var(--panel); }
.ap-tile img { width:100%; height:100%; object-fit:cover; display:block; }
.ap-tile:active img { opacity:.8; }

.sg-ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:9999; align-items:center; justify-content:center; }
.sg-ov.show { display:flex; }
.sg-ov img { max-width:95vw; max-height:88vh; border-radius:8px; object-fit:contain; }
.sg-ov-x { position:absolute; top:14px; right:14px; background:rgba(255,255,255,.08); border:none; color:#fff; width:34px; height:34px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

.sg-footer { text-align:center; font-size:11px; color:var(--muted); margin-top:30px; padding:0 20px; line-height:1.5; }

.sg-invalid { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80dvh; padding:30px; text-align:center; }
.sg-invalid-icon { font-size:44px; margin-bottom:14px; }
.sg-invalid-title { font-size:18px; font-weight:700; margin-bottom:8px; }
.sg-invalid-sub { font-size:13px; color:var(--muted); max-width:280px; }
</style>
</head>
<body>

<div id="sg-invalid" class="sg-invalid" style="display:none">
  <div class="sg-invalid-icon">🔒</div>
  <div class="sg-invalid-title">Este enlace ya no es válido</div>
  <div class="sg-invalid-sub">Pídele a quien te lo compartió que te mande uno nuevo desde su Perfil en la app.</div>
</div>

<div id="sg-content" style="display:none">
  <div class="sg-header">
    <img src="/logo-altavibra.png" alt="Alta Vibra">
    <div>
      <div class="sg-header-title">Alta Vibra</div>
      <div class="sg-header-sub"><span class="sg-live-dot"></span>California 2026 · en vivo</div>
    </div>
  </div>

  <div class="sg-wrap">
    <div class="sg-card">
      <div class="sg-day" id="sg-day">Cargando…</div>
      <div class="sg-city" id="sg-city"></div>
      <div class="sg-date" id="sg-date"></div>
    </div>

    <div class="sg-card">
      <div class="sg-km-txt" id="sg-km-txt">Calculando recorrido…</div>
      <div class="sg-km-track"><div class="sg-km-bar" id="sg-km-bar"></div></div>
    </div>

    <div class="sg-section-title">📍 Dónde andan</div>
    <div id="sg-map"></div>
    <div class="sg-legend" id="sg-legend"></div>

    <div class="sg-section-title">📷 Recuerdos del viaje</div>
    <div class="ap-grid" id="sg-gallery"></div>

    <div class="sg-footer">Vista de solo lectura para familiares y amigos · Alta Vibra · California 2026</div>
  </div>
</div>

<div class="sg-ov" id="sg-ov" onclick="closeLightbox()">
  <button class="sg-ov-x" onclick="event.stopPropagation();closeLightbox()">&#10005;</button>
  <img id="sg-ov-img" src="" onclick="event.stopPropagation()">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}

var PERSONS_DEFAULT = ['Erick','Rafa','Eduardo'];
var PC = ['#00C8FF','#FF6A50','#00E598','#F5A623','#B983FF','#FF4FA3','#4FD8FF','#FFD84F'];
var DAYS_SKEL = [
  {date:'2 Sep',wd:'Martes'},
  {date:'3 Sep',wd:'Miércoles'},
  {date:'4 Sep',wd:'Jueves'},
  {date:'5 Sep',wd:'Viernes'},
  {date:'6 Sep',wd:'Sábado'},
  {date:'7 Sep',wd:'Domingo'},
  {date:'8 Sep',wd:'Lunes'},
  {date:'9 Sep',wd:'Martes'},
  {date:'10 Sep',wd:'Miércoles'},
];

var token = (function(){
  var m = location.pathname.match(/\/seguir\/([^\/]+)/);
  return m ? decodeURIComponent(m[1]).trim() : '';
})();

var DAYS = [];
var mapObj = null, markers = {};

function buildDays(itinStore){
  DAYS = DAYS_SKEL.map(function(d){ return {date:d.date, wd:d.wd, city:'Por definir', acts:[]}; });
  Object.keys(itinStore||{}).forEach(function(k){
    var i = parseInt(k,10);
    if(!DAYS[i]) return;
    var e = itinStore[k] || {};
    if(e.city) DAYS[i].city = e.city;
    if(Array.isArray(e.acts)) DAYS[i].acts = e.acts;
  });
}

function computeItinStatus(){
  var now = new Date();
  var tripStart = new Date('2026-09-02');
  var tripEnd = new Date('2026-09-12');
  if(now<tripStart) return {todayIdx:-1, curActIdx:-1};
  if(now>=tripEnd) return {todayIdx:DAYS.length, curActIdx:-1};
  var todayIdx = Math.min(Math.floor((now-tripStart)/(1000*60*60*24)), DAYS.length-1);
  var curMins = now.getHours()*60+now.getMinutes();
  var curActIdx=-1;
  (DAYS[todayIdx].acts||[]).forEach(function(a,ai){
    if(a.t && /^\d{1,2}:\d{2}$/.test(a.t)){
      var p = a.t.split(':');
      var mins = parseInt(p[0],10)*60+parseInt(p[1],10);
      if(mins<=curMins) curActIdx=ai;
    }
  });
  return {todayIdx:todayIdx, curActIdx:curActIdx};
}

function haversineKm(a,b){
  var R=6371;
  var dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  var lat1=a[0]*Math.PI/180, lat2=b[0]*Math.PI/180;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

function computeKm(){
  var status = computeItinStatus();
  var allPts = [];
  DAYS.forEach(function(d){ (d.acts||[]).forEach(function(a){ if(a.c) allPts.push(a.c); }); });
  var total=0;
  for(var i=1;i<allPts.length;i++) total += haversineKm(allPts[i-1], allPts[i]);

  var soFar = 0;
  if(status.todayIdx===DAYS.length){
    soFar = total;
  } else if(status.todayIdx>=0){
    var ptsSoFar=[];
    for(var di=0; di<status.todayIdx; di++){
      (DAYS[di].acts||[]).forEach(function(a){ if(a.c) ptsSoFar.push(a.c); });
    }
    (DAYS[status.todayIdx].acts||[]).slice(0, status.curActIdx+1).forEach(function(a){
      if(a.c) ptsSoFar.push(a.c);
    });
    for(var j=1;j<ptsSoFar.length;j++) soFar += haversineKm(ptsSoFar[j-1], ptsSoFar[j]);
  }
  return {soFar: Math.round(soFar), total: Math.round(total), status: status};
}

function renderStatus(){
  var k = computeKm();
  var s = k.status;
  var elDay = document.getElementById('sg-day');
  var elCity = document.getElementById('sg-city');
  var elDate = document.getElementById('sg-date');
  if(s.todayIdx<0){
    elDay.textContent = 'El viaje aún no empieza';
    elCity.textContent = 'Arranca el 2 de septiembre';
    elDate.textContent = '';
  } else if(s.todayIdx>=DAYS.length){
    elDay.textContent = '¡El viaje ya terminó!';
    elCity.textContent = 'Gracias por seguirlo 💙';
    elDate.textContent = '';
  } else {
    var d = DAYS[s.todayIdx];
    elDay.textContent = 'Día '+(s.todayIdx+1)+' de '+DAYS.length;
    elCity.textContent = d.city || 'Por definir';
    elDate.textContent = d.wd+' '+d.date;
  }
  document.getElementById('sg-km-txt').textContent =
    k.soFar+' km recorridos'+(k.total?' de ~'+k.total+' km':'');
  var pct = k.total ? Math.min(100, Math.round(k.soFar/k.total*100)) : 0;
  document.getElementById('sg-km-bar').style.width = pct+'%';
}

function colorFor(name){
  var i = PERSONS_DEFAULT.indexOf(name);
  if(i>=0) return PC[i];
  var h=0;
  for(var c=0;c<name.length;c++) h = (h*31+name.charCodeAt(c))>>>0;
  return PC[h % PC.length];
}

function initMap(){
  mapObj = L.map('sg-map', {zoomControl:true}).setView([36.0,-120.2],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'© OpenStreetMap contributors © CARTO', maxZoom:19, subdomains:'abcd'
  }).addTo(mapObj);
}

async function refreshLocations(){
  try{
    var r = await fetch('/api/live-locations',{cache:'no-store'});
    var data = await r.json();
    var names = Object.keys(data);
    var legend = document.getElementById('sg-legend');
    var bounds = [];
    var seen = {};
    var legendHtml = '';
    if(!names.length){
      legendHtml = '<div class="sg-empty-mini">Nadie está compartiendo su ubicación ahora mismo.</div>';
    }
    names.forEach(function(name){
      var loc = data[name];
      if(!loc) return;
      var color = colorFor(name);
      var fresh = (Date.now()-loc.ts) < 10*60*1000;
      seen[name] = true;
      bounds.push([loc.lat, loc.lon]);
      if(mapObj){
        try{
          if(markers[name]){
            markers[name].setLatLng([loc.lat, loc.lon]);
          } else {
            var icon = L.divIcon({
              className:'',
              html:'<div style="width:16px;height:16px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 0 0 3px '+color+'55,0 2px 8px rgba(0,0,0,.5)'+(fresh?'':';opacity:.55')+'"></div>',
              iconSize:[16,16], iconAnchor:[8,8], popupAnchor:[0,-10],
            });
            markers[name] = L.marker([loc.lat,loc.lon],{icon:icon}).addTo(mapObj).bindPopup(esc(name));
          }
        }catch(e){ /* el mapa no cargó, pero la lista de quién anda dónde sigue sirviendo */ }
      }
      var mins = Math.round((Date.now()-loc.ts)/60000);
      var cuando = fresh ? 'en vivo ahora' : (mins<60 ? 'hace '+mins+' min' : 'hace '+Math.round(mins/60)+' h');
      legendHtml += '<div class="sg-legend-item"><span class="sg-dot" style="background:'+color+'"></span>'+esc(name)+'<span class="sg-legend-when">· '+cuando+'</span></div>';
    });
    legend.innerHTML = legendHtml;
    if(mapObj){
      Object.keys(markers).forEach(function(name){
        if(!seen[name]){ mapObj.removeLayer(markers[name]); delete markers[name]; }
      });
      if(bounds.length) mapObj.fitBounds(bounds, {maxZoom:11, padding:[30,30]});
    }
  }catch(e){ /* sin conexión */ }
}

var SG_PHOTOS = [];
async function refreshPhotos(){
  try{
    var r = await fetch('/api/memory',{cache:'no-store'});
    var mem = await r.json();
    var flat = [];
    Object.keys(mem).forEach(function(key){
      (mem[key]||[]).forEach(function(p){ flat.push(p); });
    });
    flat.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
    SG_PHOTOS = flat;
    var grid = document.getElementById('sg-gallery');
    if(!flat.length){
      grid.outerHTML = '<div class="sg-empty-mini" id="sg-gallery">Aún no hay fotos compartidas.</div>';
      return;
    }
    grid.innerHTML = flat.map(function(p,idx){
      return '<div class="ap-tile" onclick="openLightbox('+idx+')"><img src="'+p.photo+'" loading="lazy"></div>';
    }).join('');
  }catch(e){ /* sin conexión */ }
}

function openLightbox(idx){
  var p = SG_PHOTOS[idx];
  if(!p) return;
  document.getElementById('sg-ov-img').src = p.photo;
  document.getElementById('sg-ov').classList.add('show');
}
function closeLightbox(){
  document.getElementById('sg-ov').classList.remove('show');
}

function showInvalid(){
  document.getElementById('sg-invalid').style.display = 'flex';
  document.getElementById('sg-content').style.display = 'none';
}

async function init(){
  if(!token){ showInvalid(); return; }
  var check = { ok:false };
  try{ check = await (await fetch('/api/viewer-check/'+encodeURIComponent(token))).json(); }catch(e){}
  if(!check.ok){ showInvalid(); return; }

  document.getElementById('sg-invalid').style.display = 'none';
  document.getElementById('sg-content').style.display = 'block';

  var itinStore = {};
  try{ itinStore = await (await fetch('/api/itinerary',{cache:'no-store'})).json(); }catch(e){}
  buildDays(itinStore);
  renderStatus();
  try{ initMap(); }catch(e){ /* Leaflet no cargó (sin conexión al CDN) — se sigue sin mapa */ }
  await refreshLocations();
  await refreshPhotos();

  setInterval(function(){ renderStatus(); refreshLocations(); }, 20000);
  setInterval(refreshPhotos, 60000);
}
init();
</script>
</body>
</html>
